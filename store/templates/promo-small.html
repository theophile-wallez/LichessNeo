<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="size" content="440x280">
<meta name="languages" content="en,fr">
<script>document.documentElement.lang = location.hash.slice(1) || 'en';</script>
<link rel="stylesheet" href="store.css">
<style>
  body {
    --w: 440px;
    --h: 280px;
    --glow-x: 80%;
    --glow-y: 30%;
    --grid-x: 20%;
    --grid-y: 0%;
  }

  header {
    top: 30px;
    left: 24px;
    width: 170px;
    gap: 16px;
  }

  .brand {
    gap: 8px;
    font-size: 16px;
  }

  .brand img {
    width: 28px;
    height: 28px;
  }

  h1 {
    font-size: 31px;
    line-height: 1.04;
  }

  .stage {
    top: 22px;
    left: 186px;
    width: 300px;
    height: 210px;
    perspective: 700px;
  }

  .stage > .window {
    width: 330px;
    transform: rotateY(-22deg) rotateX(5deg);
  }

  .window::before {
    top: 8px;
    left: 10px;
    width: 8px;
    height: 8px;
    box-shadow: 13px 0 #febc2e, 26px 0 #28c840;
  }

  .window > p {
    height: 22px;
  }

  .window > div {
    height: calc(100% - 22px);
  }

  .window > div img {
    left: -84px;
    top: -12px;
    width: 520px;
  }

  .say {
    top: 168px;
    right: 14px;
    height: 82px;
    gap: 4px;
    padding: 12px 16px 12px 104px;
    border-radius: 14px;
    transform: rotate(-3deg);
  }

  .say > img {
    left: 6px;
    bottom: -12px;
    height: 92px;
  }

  .say .move {
    gap: 8px;
    font-size: 19px;
  }

  .say .move b {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 16px;
  }

  .say .why {
    font-size: 13px;
  }
</style>

<header>
  <p class="brand"><img src="../../public/icons/icon128.png">Lichess Neo</p>
  <h1 lang="en">Lichess, <em>made modern</em></h1>
  <h1 lang="fr">Lichess, <em>version moderne</em></h1>
</header>

<div class="stage">
  <div class="window">
    <p></p>
    <div>
      <img lang="en" src="shots/review-brilliant-en.webp">
      <img lang="fr" src="shots/review-brilliant-fr.webp">
    </div>
  </div>
</div>

<div class="say">
  <img src="coaches/coach-2-delight.webp">
  <p class="move"><b>!!</b><span lang="en">Qxc1, brilliant!</span><span lang="fr">Dxc1, brillant !</span></p>
  <p class="why" lang="en">Explained by your coach</p>
  <p class="why" lang="fr">Expliqué par votre coach</p>
</div>
