<!doctype html>
<meta charset="utf-8">
<meta name="size" content="440x280">
<link rel="stylesheet" href="store.css">
<style>
  body {
    --w: 440px;
    --h: 280px;
    --glow-x: 0%;
    --glow-y: 0%;
  }

  body::before {
    background-size: 40px 40px;
  }

  .brand {
    position: absolute;
    top: 44px;
    left: 30px;
    width: 240px;
    display: grid;
    justify-items: start;
    gap: 10px;
  }

  .brand img {
    width: 84px;
    height: 84px;
    margin: -12px 0 -8px -12px;
  }

  .brand h2 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .brand p {
    color: var(--dim);
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
  }

  .brand p b {
    color: var(--green-hi);
  }

  .mini {
    position: absolute;
    top: 40px;
    right: -36px;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    width: 200px;
    aspect-ratio: 1;
    border-radius: 18px;
    background: url(../../packs/example/board.svg) 0 0 / 266.67% 266.67%;
    box-shadow: 0 0 0 1px #ffffff1f, 0 20px 50px #000000b3;
    transform: rotate(-10deg);
  }

  .mini img {
    width: 100%;
  }

  .mini .badge {
    position: absolute;
    top: 54px;
    left: 108px;
    --size: 34px;
  }
</style>

<div class="brand">
  <img src="../../public/icons/icon128.png">
  <h2>Lichess Reimagined</h2>
  <p>Lichess, made <b>modern</b></p>
</div>

<div class="mini">
  <i></i><i></i><img src="../../packs/example/pieces/bK.svg">
  <i></i><img src="../../packs/example/pieces/wN.svg"><i></i>
  <img src="../../packs/example/pieces/wP.svg"><i></i><i></i>
  <span class="badge" style="--c: #1cb3c8">!!</span>
</div>
