<!doctype html>
<meta charset="utf-8">
<meta name="size" content="1400x560">
<link rel="stylesheet" href="store.css">
<style>
  body {
    --w: 1400px;
    --h: 560px;
    --glow-x: 0%;
    --glow-y: 0%;
    --grid-x: 20%;
    --grid-y: 0%;
  }

  header {
    position: absolute;
    top: 86px;
    left: 72px;
    width: 560px;
    display: grid;
    justify-items: start;
    gap: 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .brand img {
    width: 64px;
    height: 64px;
    margin: -8px 0 -8px -8px;
  }

  h1 {
    font-size: 64px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  .tags .chip {
    font-size: 15px;
    padding: 6px 14px 6px 6px;
    box-shadow: 0 0 0 1px #ffffff1f;
  }

  .tags .badge,
  .tags .tile {
    --size: 26px;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    font-size: 13px;
  }

  .tags .badge {
    border-radius: 50%;
  }

  .tags svg {
    width: 16px;
    height: 16px;
  }

  .window {
    top: 70px;
    left: 700px;
    width: 820px;
    transform: rotate(-4deg);
  }

  .coach {
    top: 380px;
    left: 610px;
    transform: rotate(-2deg);
  }
</style>

<header>
  <span class="brand"><img src="../../public/icons/icon128.png">Lichess Reimagined</span>
  <h1>Lichess, made <em>modern</em></h1>
  <p class="sub">A roomy layout, playful pages, your own board, pieces and sounds, and a Game Review, on free, open-source Lichess.</p>
  <div class="tags">
    <span class="chip"><span class="badge" style="--c: #1cb3c8">!!</span>Game Review</span>
    <span class="chip"><span class="tile" style="--c: #81b64c"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></span>37 boards, 40 piece sets</span>
    <span class="chip"><span class="tile" style="--c: #f7a531"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></span>Your own sounds</span>
  </div>
</header>

<div class="window">
  <div class="bar"><i></i><i></i><i></i><span><b>lichess.org</b>/hHL3BlgR</span></div>
  <div class="crop" style="--s: 0.6482; --x: 175; --y: 0; --cw: 1265; --ch: 900"><img src="shots/review.webp"></div>
</div>

<div class="crop float coach" style="--s: 1.05; --x: 1000; --y: 58; --cw: 430; --ch: 124"><img src="shots/review.webp"></div>
