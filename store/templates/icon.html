<!doctype html>
<meta charset="utf-8">
<meta name="size" content="128x128">
<meta name="icons" content="16,48,128">
<style>
  html,
  body {
    margin: 0;
    width: 128px;
    height: 128px;
    overflow: hidden;
    background: transparent;
  }

  /* Chrome's guidelines: 96px of art in the 128px icon, the rest clear.
     The small ones have no room to spare, so they fill theirs. */
  .icon {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 16px;
    overflow: hidden;
    border-radius: 22%;
  }

  .icon > * {
    position: absolute;
  }

  svg {
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* The Pion, the first coach, as the playground draws it: its bust, cut by
     the tile's bottom edge. */
  .bust {
    left: 7%;
    bottom: 0;
    width: 86%;
    filter: drop-shadow(0 2px 3px #1c145080);
  }

  /* At 16px a face is a smudge: the whole Pion reads as a pawn. Its size and
     place put its eyes on whole pixels, both alike. */
  .full {
    display: none;
    left: 22%;
    bottom: 8%;
    width: 56%;
  }

  @media (resolution < 0.5dppx) {
    .icon {
      width: 128px;
      height: 128px;
      margin: 0;
    }
  }

  @media (resolution < 0.2dppx) {
    .bust {
      display: none;
    }

    .full {
      display: block;
    }
  }
</style>

<div class="icon">
  <svg viewBox="0 0 100 100">
    <defs>
      <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7b6cff"/>
        <stop offset="0.55" stop-color="#5a4ce0"/>
        <stop offset="1" stop-color="#3f33b8"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#tile)"/>
    <!-- the tile's lit top edge and dark bottom one -->
    <rect x="0" y="1.5" width="100" height="100" rx="22" fill="none" stroke="#b3a9ff" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="0" y="-3" width="100" height="100" rx="22" fill="none" stroke="#2a2080" stroke-opacity="0.5" stroke-width="3"/>
  </svg>
  <img class="bust" src="coaches/icon-pion-bust.webp">
  <img class="full" src="coaches/icon-pion-full.webp">
</div>
