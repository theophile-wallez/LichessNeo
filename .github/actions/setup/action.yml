name: Setup
description: pnpm and Node at the repository's versions, and the dependencies. The caller checks out first.

runs:
  using: composite
  steps:
    # The version comes from package.json's packageManager field.
    - uses: pnpm/action-setup@v6.1.1

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
