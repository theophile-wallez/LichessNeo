# Each push to main runs the CI, zips the extension (for Chrome, the Chrome
# Web Store and Firefox) and publishes the zips as a GitHub release. The
# manifest keeps only `<major>.<minor>`: the version adds the number of
# commits since that last changed, so each push gets a new, higher one and
# nobody changes it by hand.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The CI has packaged this commit: only check the version it got.
  version:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, to count the commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Version
        id: version
        run: echo "version=$(node scripts/version.ts)" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A manual run on a commit that has a release already.
          if gh release view "v$VERSION" --json tagName > /dev/null; then
            echo "v$VERSION has a release already."
            exit 0
          fi
          gh release create "v$VERSION" \
            "LichessNeo-v$VERSION.zip" \
            "LichessNeo-v$VERSION-store.zip" \
            "LichessNeo-v$VERSION-firefox.zip" \
            --target "$GITHUB_SHA" \
            --title "Lichess Neo $VERSION" \
            --generate-notes
